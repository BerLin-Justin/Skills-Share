interface:
  display_name: "PRD-Killer"
  short_description: "以业务流程、数据流转、时序和技术架构图理顺 PRD，用少量文字讲清改动和原因"
  default_prompt: "请使用 $prd-killer 将这份需求整理成图为主的研发交接稿，绘制并渲染业务流程、数据流转、关键时序和技术架构图，用短注解释做什么及为什么，保留关键异常与待确认，业务规则和验收放附录；默认另交独立开发顺序清单Markdown，用复选框列任务、依赖和完成条件，保留已有进度；涉及关键调用或接口变更时，另交独立关键接口契约，无工程依据时明确为需求级草案。各文档相互链接、范围及版本一致。"
