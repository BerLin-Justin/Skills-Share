<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" font-family="Microsoft YaHei, sans-serif">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#65758B"/></marker></defs>
<rect width="1100" height="980" fill="#FFFFFF"/>
<text x="35" y="43" font-size="27" text-anchor="start" fill="#18304B" font-weight="bold">图 03｜收款数据：谁产生事实，何时影响应收</text>
<text x="35" y="78" font-size="17" text-anchor="start" fill="#63728A" font-weight="normal">候选业务实体，非数据库表名｜粗粒度关联键需由银行协议与工程共同核实</text>
<rect x="40" y="125" width="320" height="110" rx="12" fill="#EAF2FF" stroke="#396DA7" stroke-width="1.8" />
<text x="200.0" y="159.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">业务订单／应收对象</text>
<text x="200.0" y="187.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">业务标识、应收额、币种</text>
<text x="200.0" y="215.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">权威：业务侧</text>
<rect x="650" y="125" width="400" height="110" rx="12" fill="#FFF3DF" stroke="#B7791F" stroke-width="1.8" />
<text x="850.0" y="159.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">收款单：归属一笔应收业务</text>
<text x="850.0" y="187.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">本地收款标识、目标账户</text>
<text x="850.0" y="215.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">申请金额／币种／快照</text>
<polyline points="360,180 650,180" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="437.0" y="144" width="126" height="23" rx="3" fill="white"/>
<text x="500" y="160" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">读取应收与归属</text>
<rect x="650" y="340" width="400" height="115" rx="12" fill="#FFF3DF" stroke="#B7791F" stroke-width="1.8" />
<text x="850.0" y="376.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">银行请求记录：逐次留痕</text>
<text x="850.0" y="404.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">本地单标识 + 稳定请求标识</text>
<text x="850.0" y="432.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">请求摘要、银行关联标识</text>
<polyline points="850,235 850,340" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="795.0" y="271" width="110" height="23" rx="3" fill="white"/>
<text x="850" y="287" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">写入本次请求</text>
<rect x="40" y="340" width="320" height="115" rx="12" fill="#F0F2F5" stroke="#687587" stroke-width="1.8" />
<text x="200.0" y="376.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">银行交易／回单／流水</text>
<text x="200.0" y="404.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">银行交易标识、结果、金额</text>
<text x="200.0" y="432.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">权威：银行原始事实</text>
<polyline points="650,395 360,395" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="405.0" y="359" width="190" height="23" rx="3" fill="white"/>
<text x="500" y="375" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">提交请求／按原标识查证</text>
<rect x="40" y="570" width="390" height="120" rx="12" fill="#FFF3DF" stroke="#B7791F" stroke-width="1.8" />
<text x="235.0" y="609.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">结果证据：保留原始关联</text>
<text x="235.0" y="637.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">回调（若有）／查单／流水</text>
<text x="235.0" y="665.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">银行状态时间 + 本地接收时间</text>
<polyline points="200,455 200,570" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="113.0" y="502" width="174" height="23" rx="3" fill="white"/>
<text x="200" y="518" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">写入受保护的银行证据</text>
<rect x="650" y="570" width="400" height="120" rx="12" fill="#E9F6EF" stroke="#337E58" stroke-width="1.8" />
<text x="850.0" y="609.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">结果归并：校验身份与归属</text>
<text x="850.0" y="637.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">金额／币种／银行交易防重</text>
<text x="850.0" y="665.0" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">只让有效成功一次影响业务</text>
<polyline points="430,630 650,630" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="501.0" y="594" width="78" height="23" rx="3" fill="white"/>
<text x="540" y="610" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">核验证据</text>
<rect x="200" y="795" width="700" height="105" rx="12" fill="#EAF2FF" stroke="#396DA7" stroke-width="1.8" />
<text x="550.0" y="840.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">写收款状态 + 业务生效记录 → 提供应收查询</text>
<text x="550.0" y="868.5" font-size="20" text-anchor="middle" fill="#18304B" font-weight="normal">收款成功 ≠ 默认可提现余额；到账／结算口径见 Q07</text>
<polyline points="850,690 850,740 550,740 550,795" fill="none" stroke="#65758B" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="547.0" y="712" width="206" height="23" rx="3" fill="white"/>
<text x="650" y="728" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">写确认结果与业务生效依据</text>
<text x="35" y="958" font-size="14" text-anchor="start" fill="#68768B" font-weight="normal">实线标读写方向；相同银行交易只能归属一次；跨库业务生效需可恢复的投递记录（候选）</text>
</svg>