<rect x="781.0" y="854" width="78" height="23" rx="3" fill="white"/>
<text x="820" y="870" font-size="16" text-anchor="middle" fill="#18304B" font-weight="normal">取得事实</text>
<text x="35" y="1038" font-size="14" text-anchor="start" fill="#68768B" font-weight="normal">颜色表示职责语义；全部为候选逻辑分工。没有代码证据，不声称现有组件可复用。</text>
