<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486583"/></marker></defs><rect width="1200" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#18334F"><text x="34" y="38" font-size="25" text-anchor="start" font-weight="600">05  真实付款事实与核销时序</text><text x="34" y="68" font-size="16" text-anchor="start" font-weight="400">候选登记／同步方案；事实来源待核实，本图不假定已有银行转账接口。</text><rect x="20" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="135" y="129" font-size="18" text-anchor="middle" font-weight="400">财务／事实来源</text><line x1="135" y1="150" x2="135" y2="835" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="330" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="445" y="129" font-size="18" text-anchor="middle" font-weight="400">付款核销处理</text><line x1="445" y1="150" x2="445" y2="835" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="640" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="755" y="129" font-size="18" text-anchor="middle" font-weight="400">业务事实存储</text><line x1="755" y1="150" x2="755" y2="835" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="950" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="1065" y="129" font-size="18" text-anchor="middle" font-weight="400">台账／履约查询</text><line x1="1065" y1="150" x2="1065" y2="835" stroke="#9EAEBD" stroke-dasharray="5 5"/><line x1="135" y1="200" x2="445" y2="200" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="290.0" y="190" font-size="17" text-anchor="middle" font-weight="400">01 FKSQ与出款事实凭证</text><line x1="445" y1="260" x2="755" y2="260" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="600.0" y="250" font-size="17" text-anchor="middle" font-weight="400">02 查获批资格、目标单和防重结果</text><line x1="755" y1="320" x2="445" y2="320" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="600.0" y="310" font-size="17" text-anchor="middle" font-weight="400">03 当前状态／已有入账结果</text><rect x="300" y="360" width="620" height="190" rx="8" fill="#E6F4EA" fill-opacity="0.75" stroke="#98ADBD"/><text x="313" y="386" font-size="16" text-anchor="start" font-weight="600">alt 真实出款已核实</text><line x1="445" y1="430" x2="755" y2="430" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="600.0" y="420" font-size="17" text-anchor="middle" font-weight="400">04 保存FK＋逐单归属＋核销关系</text><line x1="755" y1="500" x2="445" y2="500" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="600.0" y="490" font-size="17" text-anchor="middle" font-weight="400">05 原／新入账结果；本库一致提交</text><rect x="25" y="580" width="900" height="95" rx="8" fill="#FDECEC" fill-opacity="0.75" stroke="#98ADBD"/><text x="38" y="606" font-size="16" text-anchor="start" font-weight="600">else 未出款、失败或结果未知</text><line x1="445" y1="647" x2="135" y2="647" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="290.0" y="637" font-size="17" text-anchor="middle" font-weight="400">不核销；按原事实标识查证后再处理</text><line x1="1065" y1="735" x2="755" y2="735" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="910.0" y="725" font-size="17" text-anchor="middle" font-weight="400">06 按同一实际记录标识查询</text><line x1="755" y1="790" x2="1065" y2="790" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="910.0" y="780" font-size="17" text-anchor="middle" font-weight="400">07 同一金额、状态和归属关系</text><text x="34" y="850" font-size="16" text-anchor="start" font-weight="400">已出款但本地保存失败：恢复入账与核销，不重复办理真实付款。</text><text x="34" y="875" font-size="16" text-anchor="start" font-weight="400">若本期需要发起外部付款，须另补受理、结果查询与外部幂等协议。</text></g></svg>