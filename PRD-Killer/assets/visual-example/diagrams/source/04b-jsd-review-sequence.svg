<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="985" viewBox="0 0 1200 985"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486583"/></marker></defs><rect width="1200" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#18334F"><text x="34" y="38" font-size="25" text-anchor="start" font-weight="600">04b  JSD 审批时序</text><text x="34" y="68" font-size="16" text-anchor="start" font-weight="400">候选本库处理边界；批准后的额度转换口径仍需确认，不在图中擅自定案。</text><rect x="25" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="140" y="129" font-size="18" text-anchor="middle" font-weight="400">审批待办／事件</text><line x1="140" y1="150" x2="140" y2="900" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="485" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="600" y="129" font-size="18" text-anchor="middle" font-weight="400">JSD 业务处理</text><line x1="600" y1="150" x2="600" y2="900" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="945" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="1060" y="129" font-size="18" text-anchor="middle" font-weight="400">额度与单据存储</text><line x1="1060" y1="150" x2="1060" y2="900" stroke="#9EAEBD" stroke-dasharray="5 5"/><line x1="140" y1="200" x2="600" y2="200" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="370.0" y="190" font-size="17" text-anchor="middle" font-weight="400">01 审批结果＋申请版本＋事件标识</text><line x1="600" y1="255" x2="1060" y2="255" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830.0" y="245" font-size="17" text-anchor="middle" font-weight="400">02 查状态、防重结果和本申请占用</text><line x1="1060" y1="310" x2="600" y2="310" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="830.0" y="300" font-size="17" text-anchor="middle" font-weight="400">03 当前结果；本单已占额度可识别</text><line x1="600" y1="365" x2="140" y2="365" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="370.0" y="355" font-size="17" text-anchor="middle" font-weight="400">已处理：返回原结果，到此结束</text><rect x="385" y="402" width="765" height="210" rx="8" fill="#E6F4EA" fill-opacity="0.75" stroke="#98ADBD"/><text x="398" y="428" font-size="16" text-anchor="start" font-weight="600">alt 首次批准且当前复核通过</text><line x1="600" y1="475" x2="1060" y2="475" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830.0" y="465" font-size="17" text-anchor="middle" font-weight="400">04 本单占用不重复扣减；原子保存</text><text x="830" y="500" font-size="15" text-anchor="middle" font-weight="400">获批状态＋逐计划未开始应付单＋防重记录</text><line x1="1060" y1="562" x2="600" y2="562" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="830.0" y="552" font-size="17" text-anchor="middle" font-weight="400">05 统一提交结果／可定位异常</text><rect x="385" y="636" width="765" height="132" rx="8" fill="#FFF2DF" fill-opacity="0.75" stroke="#98ADBD"/><text x="398" y="662" font-size="16" text-anchor="start" font-weight="600">else 驳回</text><line x1="600" y1="690" x2="1060" y2="690" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830.0" y="680" font-size="17" text-anchor="middle" font-weight="400">04 驳回记录＋仅释放本申请占额</text><line x1="1060" y1="746" x2="600" y2="746" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="830.0" y="736" font-size="17" text-anchor="middle" font-weight="400">05 幂等释放结果，不影响其他申请</text><line x1="600" y1="817" x2="140" y2="817" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="370.0" y="807" font-size="17" text-anchor="middle" font-weight="400">06 返回处理结果</text><text x="34" y="892" font-size="16" text-anchor="start" font-weight="400">当前复核失败：不出单；退回、驳回或异常处理路径待确认。</text><text x="34" y="917" font-size="16" text-anchor="start" font-weight="400">批准与驳回是替代分支；迟到／重复事件不能覆盖已生效结果。</text></g></svg>