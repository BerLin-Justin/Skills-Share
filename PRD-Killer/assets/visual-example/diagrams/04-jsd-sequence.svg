<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486583"/></marker></defs><rect width="1200" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#18334F"><text x="34" y="38" font-size="25" text-anchor="start" font-weight="600">04  JSD 提交时序</text><text x="34" y="68" font-size="16" text-anchor="start" font-weight="400">候选同库协作：重新校验、占额和申请保存一起提交；具体工程机制待核实。</text><rect x="25" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="140" y="129" font-size="18" text-anchor="middle" font-weight="400">发起人／页面</text><line x1="140" y1="150" x2="140" y2="765" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="485" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="600" y="129" font-size="18" text-anchor="middle" font-weight="400">JSD 业务处理</text><line x1="600" y1="150" x2="600" y2="765" stroke="#9EAEBD" stroke-dasharray="5 5"/><rect x="945" y="94" width="230" height="56" rx="10" fill="#EAF2FF" stroke="#6387B1"/><text x="1060" y="129" font-size="18" text-anchor="middle" font-weight="400">额度与申请存储</text><line x1="1060" y1="150" x2="1060" y2="765" stroke="#9EAEBD" stroke-dasharray="5 5"/><line x1="140" y1="200" x2="600" y2="200" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="370.0" y="190" font-size="17" text-anchor="middle" font-weight="400">01 提交计划、金额、请求标识</text><line x1="600" y1="265" x2="1060" y2="265" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830.0" y="255" font-size="17" text-anchor="middle" font-weight="400">02 校验身份、版本及当前可用额</text><line x1="1060" y1="320" x2="600" y2="320" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="830.0" y="310" font-size="17" text-anchor="middle" font-weight="400">03 当前额度与已有处理结果</text><rect x="390" y="355" width="760" height="215" rx="8" fill="#E6F4EA" fill-opacity="0.75" stroke="#98ADBD"/><text x="403" y="381" font-size="16" text-anchor="start" font-weight="600">条件通过：本库事务</text><line x1="600" y1="425" x2="1060" y2="425" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)"/><text x="830.0" y="415" font-size="17" text-anchor="middle" font-weight="400">04 二次校验＋占额＋JSD＋提交快照</text><line x1="1060" y1="485" x2="600" y2="485" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="830.0" y="475" font-size="17" text-anchor="middle" font-weight="400">05 一并提交；失败则不留本次占额</text><line x1="600" y1="545" x2="140" y2="545" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="370.0" y="535" font-size="17" text-anchor="middle" font-weight="400">06 返回原／新申请编号和待审状态</text><rect x="45" y="600" width="1110" height="92" rx="8" fill="#FDECEC" fill-opacity="0.75" stroke="#98ADBD"/><text x="58" y="626" font-size="16" text-anchor="start" font-weight="600">条件失败或并发冲突</text><line x1="600" y1="664" x2="140" y2="664" stroke="#486583" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="370.0" y="654" font-size="17" text-anchor="middle" font-weight="400">拒绝本次提交，保留输入并提示最新余额</text><text x="34" y="752" font-size="16" text-anchor="start" font-weight="400">重复提交：先查原结果，不重复占额。响应丢失：按请求标识查证，不重新创建申请。</text><text x="34" y="777" font-size="16" text-anchor="start" font-weight="400">实线＝调用；虚线箭头＝返回。快照供追溯，审批仍读取当前值。</text></g></svg>